<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0e0f10"/>
<title>Présences TPS</title>
<style>
:root{--bg:#0e0f10;--panel:#17191b;--panel-2:#1e2124;--line:#2a2e32;--text:#e8e6e1;--muted:#9a958c;--gold:#c4a574;--gold-dim:#8a7349;--go:#2f6b4a;--go-bg:#1a2e22;--just:#8a6a32;--just-bg:#2a2316;--inj:#8a4545;--inj-bg:#2c1b1b;--girl:#e7a8bc;--boy:#8eb6d9;--warn:#b8893a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{padding:12px 14px 8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}h1{margin:0;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}.date{color:var(--muted);font-size:12px}
nav{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1;min-height:42px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;font-size:13px}nav button.on{border-color:var(--gold-dim);color:var(--gold)}
main{max-width:560px;margin:0 auto;padding:12px} .screen{display:none}.screen.on{display:block}
.summary{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.rate{font-size:34px;font-weight:600;color:var(--gold)}.rate.pending{color:var(--muted)}.meta{color:var(--muted);font-size:13px}
.badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-top:8px}.badge.ok{color:#cfe8d6;border-color:var(--go)}
.row{display:grid;grid-template-columns:72px 1fr 72px;min-height:64px;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:8px;background:var(--panel-2)}
.row.P{background:var(--go-bg);border-color:var(--go)}.row.J{background:var(--just-bg);border-color:var(--just)}.row.I{background:var(--inj-bg);border-color:var(--inj)}
.zone{border:none;background:transparent;color:var(--muted);font-size:11px;text-transform:uppercase}.zone.l{border-right:1px solid var(--line)}.zone.r{border-left:1px solid var(--line)}
.name-btn{border:none;background:transparent;font-size:16px;font-weight:600;text-align:left;padding:8px 10px}.name-btn.girl{color:var(--girl)}.name-btn.boy{color:var(--boy)}.name-btn small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;margin:12px 0}button,input{font:inherit;color:var(--text)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;min-height:48px;font-size:15px}
.btn.gold{border-color:var(--gold-dim);color:var(--gold)}.btn.go{border-color:var(--go);color:#cfe8d6;flex:1}.btn.warn{border-color:var(--warn);color:#e6d3a8;flex:1}.btn.full{width:100%}
.locked .zone,.locked .name-btn{pointer-events:none}
.form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.form input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;margin-bottom:8px}
.sex{display:flex;gap:8px;margin-bottom:8px}.sex button{flex:1}.sex button.on.girl{border-color:var(--girl);color:var(--girl)}.sex button.on.boy{border-color:var(--boy);color:var(--boy)}
.child-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.nm.girl{color:var(--girl);font-weight:600}.nm.boy{color:var(--boy);font-weight:600}.hint{color:var(--muted);font-size:12px;line-height:1.45}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px;text-transform:uppercase}
.bar-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}.bar-row .d{width:42px;color:var(--muted)}
.track{flex:1;height:10px;background:#222;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--gold)}.fill.low{background:var(--inj)}.fill.mid{background:var(--just)}
h2{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:8px 0 12px}.legend i{font-style:normal}
</style></head><body>
<header><h1>Présences TPS</h1><div class="date" id="todayLabel"></div></header>
<nav><button class="on" data-s="jour">Jour</button><button data-s="analyse">Analyse</button><button data-s="classe">Classe</button></nav>
<main>
<section class="screen on" id="screen-jour">
<div class="summary"><div class="rate pending" id="rateBig">—</div><div class="meta" id="rateMeta">Ajoutez les enfants dans l’onglet Classe.</div><div class="badge" id="lockBadge">Journée non validée</div></div>
<div class="legend"><i>Gauche = dispensé</i><i>Centre = présent</i><i>Droite = absent</i></div>
<div id="list"></div>
<div class="actions"><button class="btn go" id="btnValid">Valider la journée</button><button class="btn warn" id="btnCorrect">Corriger</button></div>
<p class="hint">Une fois validé, Corriger pour modifier.</p>
</section>
<section class="screen" id="screen-analyse">
<div class="summary"><div class="meta" id="anHead">—</div></div>
<h2>30 derniers jours</h2><div id="chart"></div><h2>Par enfant</h2><div id="byChild"></div><h2>Jours à regarder</h2><div id="flags"></div>
<div class="actions"><button class="btn gold full" id="btnXls">Exporter Excel (CSV)</button></div>
</section>
<section class="screen" id="screen-classe">
<div class="form"><input id="first" placeholder="Prénom" autocomplete="off"/><input id="last" placeholder="Nom" autocomplete="off"/>
<div class="sex"><button class="btn on girl" id="sexF">Fille</button><button class="btn boy" id="sexM">Garçon</button></div>
<button class="btn gold full" id="btnAdd">Ajouter l’enfant</button></div>
<div id="roster"></div>
<p class="hint">Retirer cache l’enfant de la saisie. L’historique est conservé.</p>
</section></main>
<script>
const KEY="tps_v1";const $=id=>document.getElementById(id);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function todayKey(d){const x=d||new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{students:[],days:{}}}catch{return{students:[],days:{}}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
let db=load(),sex="F",screen="jour";
function activeStudents(){return db.students.filter(s=>s.active!==false)}
function dayRec(key){if(!db.days[key])db.days[key]={marks:{},validated:false};return db.days[key]}
function compute(rec,roster){const list=roster||activeStudents();let p=0,j=0,i=0,n=0,missing=0;list.forEach(s=>{n++;const m=rec.marks[s.id];if(m==="P")p++;else if(m==="J")j++;else if(m==="I")i++;else missing++});const den=n-j;return{p,j,i,n,missing,den,rate:den<=0?null:(p/den)*100}}
function rateTxt(r){return r.rate==null?"n/c":Math.round(r.rate)+" %"}
function renderNav(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.s===screen));document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id==="screen-"+screen))}
function renderJour(){const rec=dayRec(todayKey()),kids=activeStudents(),r=compute(rec,kids);$("todayLabel").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});const big=$("rateBig");big.textContent=r.missing||!kids.length?"\u2014":rateTxt(r);big.classList.toggle("pending",r.missing>0||r.rate==null||!rec.validated);$("rateMeta").textContent=kids.length?r.p+" présent"+(r.p>1?"s":"")+" / ("+r.n+" \u2212 "+r.j+" dispens\u00e9"+(r.j>1?"s":"")+")":"Aucun enfant.";const badge=$("lockBadge");badge.textContent=rec.validated?"Journée validée":(r.missing?r.missing+" non not\u00e9"+(r.missing>1?"s":""):"Prêt à valider");badge.className="badge"+(rec.validated?" ok":"");const list=$("list");list.className=rec.validated?"locked":"";list.innerHTML="";kids.sort((a,b)=>(a.last+a.first).localeCompare(b.last+b.first,"fr")).forEach(s=>{const m=rec.marks[s.id]||"";const row=document.createElement("div");row.className="row"+(m?" "+m:"");const left=document.createElement("button");left.className="zone l";left.textContent="Disp.";left.onclick=()=>setMark(s.id,"J");const mid=document.createElement("button");mid.className="name-btn "+(s.gender==="F"?"girl":"boy");mid.innerHTML=s.first+" <small>"+s.last+"</small>";mid.onclick=()=>setMark(s.id,"P");const right=document.createElement("button");right.className="zone r";right.textContent="Abs.";right.onclick=()=>setMark(s.id,"I");row.append(left,mid,right);list.appendChild(row)})}
function setMark(id,val){const rec=dayRec(todayKey());if(rec.validated)return;rec.marks[id]=rec.marks[id]===val?"":val;save();renderJour()}
function renderClasse(){const box=$("roster");box.innerHTML="";if(!db.students.length){box.innerHTML="<p class='hint'>Pas encore d\u2019élève.</p>";return}db.students.forEach(s=>{const card=document.createElement("div");card.className="child-card";const left=document.createElement("div");left.innerHTML="<div class='nm "+(s.gender==="F"?"girl":"boy")+"'>"+s.first+" "+s.last+"</div><div class='hint'>"+(s.gender==="F"?"Fille":"Gar\u00e7on")+(s.active===false?" \u00b7 retir\u00e9":"")+"</div>";const tog=document.createElement("button");tog.className="btn";tog.textContent=s.active===false?"Réintégrer":"Retirer";tog.onclick=()=>{s.active=s.active===false;save();renderClasse();renderJour()};const right=document.createElement("div");right.appendChild(tog);card.append(left,right);box.appendChild(card)})}
function lastDays(n){const out=[],d=new Date();for(let i=0;i<n;i++){out.push(todayKey(d));d.setDate(d.getDate()-1)}return out}
function rosterForDay(key){const rec=db.days[key];if(rec&&rec.snapshot&&rec.snapshot.length)return rec.snapshot.map(id=>db.students.find(s=>s.id===id)).filter(Boolean);return activeStudents()}
function renderAnalyse(){const days=lastDays(30);let sum=0,nb=0;const chart=$("chart");chart.innerHTML="";const flags=[];days.slice().reverse().forEach(k=>{const rec=db.days[k];if(!rec||!rec.validated)return;const r=compute(rec,rosterForDay(k));if(r.rate==null)return;sum+=r.rate;nb++;const lab=k.slice(8)+"/"+k.slice(5,7);const cls=r.rate<80?"low":r.rate<92?"mid":"";const row=document.createElement("div");row.className="bar-row";row.innerHTML="<span class='d'>"+lab+"</span><div class='track'><div class='fill "+cls+"' style='width:"+Math.min(100,r.rate)+"%'></div></div><span>"+Math.round(r.rate)+"%</span>";chart.appendChild(row);if(r.i>0&&r.rate<90)flags.push(k+" : "+r.i+" absent"+(r.i>1?"s":"")+" \u2014 taux "+Math.round(r.rate)+" %");else if(r.j>=3&&r.rate>=90)flags.push(k+" : classe réduite ("+r.j+" dispens\u00e9"+(r.j>1?"s":"")+"), taux "+Math.round(r.rate)+" %")});$("anHead").textContent=nb?("Moyenne "+Math.round(sum/nb)+" % sur "+nb+" jour"+(nb>1?"s":"")+" valid\u00e9"+(nb>1?"s":"")):"Aucune journée validée.";if(!chart.children.length)chart.innerHTML="<p class='hint'>Validez une journée pour voir la courbe.</p>";const by={};Object.keys(db.days).forEach(k=>{const rec=db.days[k];if(!rec||!rec.validated)return;rosterForDay(k).forEach(s=>{if(!by[s.id])by[s.id]={s,P:0,J:0,I:0};const m=rec.marks[s.id];if(m==="P"||m==="J"||m==="I")by[s.id][m]++})});const box=$("byChild");box.innerHTML="";const rows=Object.values(by).sort((a,b)=>(a.s.last+a.s.first).localeCompare(b.s.last+b.s.first,"fr"));if(!rows.length)box.innerHTML="<p class='hint'>Pas encore de stats.</p>";rows.forEach(({s,P,J,I})=>{const den=P+J+I-J,rate=den<=0?"n/c":Math.round(P/den*100)+" %";const div=document.createElement("div");div.className="child-card";div.innerHTML="<div><div class='nm "+(s.gender==="F"?"girl":"boy")+"'>"+s.first+" "+s.last+"</div><div class='hint'>Présent "+P+" \u00b7 Dispensé "+J+" \u00b7 Absent "+I+"</div></div><div>"+rate+"</div>";box.appendChild(div)});$("flags").innerHTML=flags.length?"<table><thead><tr><th>Remarque</th></tr></thead><tbody>"+flags.map(f=>"<tr><td>"+f+"</td></tr>").join("")+"</tbody></table>":"<p class='hint'>Rien de particulier.</p>"}
function render(){renderNav();renderJour();renderAnalyse();renderClasse()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{screen=b.dataset.s;render()});
$("sexF").onclick=()=>{sex="F";$("sexF").classList.add("on");$("sexM").classList.remove("on")};
$("sexM").onclick=()=>{sex="M";$("sexM").classList.add("on");$("sexF").classList.remove("on")};
$("btnAdd").onclick=()=>{const first=$("first").value.trim(),last=$("last").value.trim();if(!first||!last){alert("Prénom et nom requis.");return}db.students.push({id:uid(),first,last,gender:sex,active:true});$("first").value="";$("last").value="";save();render()};
$("btnValid").onclick=()=>{const kids=activeStudents();if(!kids.length){alert("Ajoutez d\u2019abord les enfants.");return}const rec=dayRec(todayKey()),r=compute(rec,kids);if(r.missing){alert("Notez tous les enfants ("+r.missing+" manquant"+(r.missing>1?"s":"")+").");return}rec.validated=true;rec.snapshot=kids.map(s=>s.id);save();render()};
$("btnCorrect").onclick=()=>{const rec=dayRec(todayKey());if(!rec.validated)return;if(!confirm("Rouvrir la journée ?"))return;rec.validated=false;save();render()};
$("btnXls").onclick=()=>{const lines=["\uFEFF","Journal","date;prenom;nom;sexe;etat"];Object.keys(db.days).sort().forEach(k=>{const rec=db.days[k];rosterForDay(k).forEach(s=>{const m=rec.marks[s.id]||"";const etat=m==="P"?"present":m==="J"?"dispense":m==="I"?"absent":"";if(!etat&&!rec.validated)return;lines.push([k,s.first,s.last,s.gender==="F"?"F":"G",etat].join(";"))})});lines.push("","Taux journaliers","date;presents;dispenses;absents;effectif;denominateur;taux_pct;valide");Object.keys(db.days).sort().forEach(k=>{const rec=db.days[k],r=compute(rec,rosterForDay(k));lines.push([k,r.p,r.j,r.i,r.n,r.den,r.rate==null?"":Math.round(r.rate*10)/10,rec.validated?"oui":"non"].join(";"))});const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8"}));a.download="presences-tps-"+todayKey()+".csv";a.click()};
render();
</script></body></html>
