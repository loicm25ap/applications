<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>Cadence</title>
<style>
:root{--bg:#101214;--panel:#1a1d20;--line:#2c3034;--text:#e6e3dc;--muted:#9a958c;--gold:#c4a574}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
header{padding:10px 12px 6px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.clock{color:var(--muted);font-size:12px;margin-top:3px}
.tabs{display:flex;gap:6px;padding:8px 10px}
.tab{flex:1;min-height:42px;border:1px solid var(--line);border-radius:10px;background:#17191b;color:var(--text);font-size:13px}
.tab.on.a{background:#1a3a52;border-color:#3d7aa8;color:#d4e8f4}
.tab.on.b{background:#1a3d2c;border-color:#3d8a5c;color:#d0f0dc}
.tab.on.c{background:#3d3420;border-color:#b08a3a;color:#f4e6c4}
body.theme-a{background:#152028}body.theme-b{background:#15241c}body.theme-c{background:#241c14}
main{max-width:560px;margin:0 auto;padding:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.lab{color:var(--muted);font-size:11px;text-transform:uppercase}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
input{width:100%;background:#101214;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--text);font-size:16px;margin-top:3px}
.big{font-size:28px;font-weight:600;color:var(--gold);margin:4px 0}
.kpi{background:#15181b;border:1px solid var(--line);border-radius:10px;padding:8px}
.kpi b{display:block;font-size:16px}
.hint{color:var(--muted);font-size:12px;line-height:1.4}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.btn{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;background:#17191b;color:var(--text);font-size:12px}
.btn.plus{flex:1 1 100%;min-height:56px;font-size:18px;background:#1a3d2c;border-color:#3d8a5c;color:#d0f0dc}
.btn.setup{background:#3a3224;border-color:#8a7349}
.btn.prod{background:#1a3d2c;border-color:#3d8a5c}
.btn.pause{background:#3a2430;border-color:#8a4a68}
.btn.admin{background:#2e243a;border-color:#6a4a8a}
.btn.tech{background:#24303a;border-color:#4a6a8a}
.btn.spir{background:#2a3038;border-color:#5a6878}
.btn.stop{background:#3a2424;border-color:#8a4a4a}
.btn.gold{border-color:#8a7349;color:#e4d4b0;background:#2a241c}
.phase{display:inline-block;padding:3px 8px;border-radius:99px;border:1px solid var(--line);font-size:11px;margin:6px 0}
.ok{color:#a8d4b8}.late{color:#e0a0a0}
.hist{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
</style></head><body>
<header><h1>Cadence</h1><div class="clock" id="clock"></div></header>
<div class="tabs">
<button class="tab on a" data-p="A" type="button">Pièce A</button>
<button class="tab b" data-p="B" type="button">Pièce B</button>
<button class="tab c" data-p="C" type="button">Pièce C</button>
</div>
<main>
<div class="card">
<div class="row">
<div><div class="lab">Arrivée</div><input id="arrIn" placeholder="7h40" autocomplete="off"/></div>
<div><div class="lab">Départ prévu</div><input id="depIn" placeholder="17h00" autocomplete="off"/></div>
</div>
<div class="row">
<div><div class="lab">Pause midi (min)</div><input id="p1In" inputmode="numeric" autocomplete="off"/></div>
<div><div class="lab">Pause extra (min)</div><input id="p2In" inputmode="numeric" autocomplete="off"/></div>
</div>
</div>
<div class="card" id="setupCard">
<div class="lab" id="pieceLab">Série Pièce A</div>
<div class="row3">
<div><div class="lab">TE h</div><input id="teIn" placeholder="1,5 ou 1h30" autocomplete="off"/></div>
<div><div class="lab">TP h</div><input id="tpIn" placeholder="0,5" autocomplete="off"/></div>
<div><div class="lab">Pièces</div><input id="qtyIn" inputmode="numeric" placeholder="10" autocomplete="off"/></div>
</div>
<button class="btn gold" id="btnStart" type="button" style="width:100%;margin-top:8px">Démarrer mise en route</button>
</div>
<div id="runCard" class="card" style="display:none">
<div class="lab">Chrono</div>
<div class="big" id="nowTime">00:00:00</div>
<div class="phase" id="nowPhase">—</div>
<div class="hint" id="nowMeta"></div>
<div class="row3" style="margin-top:8px">
<div class="kpi"><div class="lab">Faites</div><b id="kDone">0</b></div>
<div class="kpi"><div class="lab">Restantes</div><b id="kLeft">—</b></div>
<div class="kpi"><div class="lab">Fin estimée</div><b id="kEta">—</b></div>
</div>
<div class="hint" id="proj" style="margin-top:8px"></div>
<button class="btn plus" id="btnPiece" type="button">+1 pièce</button>
<div class="actions">
<button class="btn setup" data-ph="setup" type="button">Mise en route</button>
<button class="btn prod" data-ph="prod" type="button">Production</button>
<button class="btn pause" data-ph="pause" type="button">Pause</button>
<button class="btn admin" data-ph="admin" type="button">Admin</button>
<button class="btn tech" data-ph="support" type="button">Support</button>
<button class="btn spir" data-ph="spirale" type="button">Spirale</button>
</div>
<div class="actions">
<button class="btn gold" id="btnEnd" type="button">Terminer la série</button>
<button class="btn stop" id="btnHalt" type="button">Arrêt journée</button>
<button class="btn prod" id="btnResume" type="button" style="display:none">Reprendre demain</button>
</div>
</div>
<div id="recapCard" class="card" style="display:none">
<div class="lab">Récap série</div>
<div class="hint" id="recap"></div>
<button class="btn gold" id="btnNew" type="button" style="width:100%;margin-top:8px">Nouvelle série</button>
</div>
<div class="card hist" id="hist"></div>
</main>
<script>
const KEY="cadence_v1";
const $=id=>document.getElementById(id);
const LABELS={setup:"Mise en route",prod:"Production",pause:"Pause",admin:"Admin",support:"Support",spirale:"Spirale",stop:"Arrêt"};
function emptySeries(){return{teMs:0,tpMs:0,qty:0,done:0,phase:null,phaseStarted:0,ms:{setup:0,prod:0,pause:0,admin:0,support:0,spirale:0},started:0,ended:0,recap:null,draft:{te:"",tp:"",qty:""}}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.series){["A","B","C"].forEach(k=>{if(!x.series[k].draft)x.series[k].draft={te:"",tp:"",qty:""}});return x}}catch(e){}return{active:"A",arr:"7h40",dep:"17h00",p1:30,p2:15,halted:false,series:{A:emptySeries(),B:emptySeries(),C:emptySeries()},hist:[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
let db=load();
function parseH(v){v=String(v||"").trim().toLowerCase().replace(",",".");if(!v)return null;const hm=v.match(/^(\d+)\s*h\s*(\d+)?$/);if(hm)return ((+hm[1])+((+hm[2]||0)/60))*3600000;const n=Number(v);return isFinite(n)&&n>=0?n*3600000:null}
function parseClock(v){v=String(v||"").trim().toLowerCase().replace("h",":");const m=v.match(/^(\d{1,2}):?(\d{2})?$/);if(!m)return null;const d=new Date();d.setHours(+m[1],+(m[2]||0),0,0);return d.getTime()}
function fmt(ms){ms=Math.max(0,ms||0);const s=Math.floor(ms/1000);return String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor((s%3600)/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function hNum(ms){return ((ms||0)/3600000).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})}
function hm(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function S(){return db.series[db.active]}
function liveMs(kind){const s=S();let t=s.ms[kind]||0;if(s.phase===kind&&s.phaseStarted&&!db.halted)t+=Date.now()-s.phaseStarted;return t}
function closePhase(s){if(!s.phase||s.phase==="stop"||!s.phaseStarted)return;s.ms[s.phase]=(s.ms[s.phase]||0)+(Date.now()-s.phaseStarted);s.phaseStarted=0}
function fillDraft(){const s=S();$("teIn").value=s.draft.te||"";$("tpIn").value=s.draft.tp||"";$("qtyIn").value=s.draft.qty||"";$("arrIn").value=db.arr;$("depIn").value=db.dep;$("p1In").value=db.p1;$("p2In").value=db.p2}
function startPhase(kind){const s=S();if(db.halted)db.halted=false;if(s.phase===kind&&s.phaseStarted)return;closePhase(s);s.phase=kind;s.phaseStarted=Date.now();save();paint()}
function switchPiece(p){if(p===db.active)return;closePhase(S());db.active=p;save();paint();fillDraft()}
function startSeries(){const s=S();const te=parseH($("teIn").value),tp=parseH($("tpIn").value),qty=parseInt($("qtyIn").value,10);if(te==null||tp==null||!qty){alert("TE, TP et nombre de pièces.");return}s.draft={te:$("teIn").value,tp:$("tpIn").value,qty:$("qtyIn").value};s.teMs=te;s.tpMs=tp;s.qty=qty;s.done=0;s.ms={setup:0,prod:0,pause:0,admin:0,support:0,spirale:0};s.started=Date.now();s.ended=0;s.recap=null;s.phase="setup";s.phaseStarted=Date.now();db.halted=false;save();paint()}
function addPiece(){const s=S();if(!s.qty||s.ended)return;if(db.halted){db.halted=false;if(!s.phaseStarted){s.phase="prod";s.phaseStarted=Date.now()}}if(s.phase!=="prod")startPhase("prod");s.done=Math.min(s.qty,s.done+1);save();paint()}
function endSeries(){const s=S();if(!s.qty||s.ended)return;if(!confirm("Terminer la série "+db.active+" ?"))return;closePhase(s);s.ended=Date.now();s.phase="stop";const prod=s.ms.prod||0,real=s.done?prod/s.done:null;s.recap={done:s.done,qty:s.qty,setup:s.ms.setup,prod,pause:s.ms.pause,admin:s.ms.admin,support:s.ms.support,spirale:s.ms.spirale,te:s.teMs,tp:s.tpMs,real};db.hist.unshift({piece:db.active,when:Date.now(),...s.recap});if(db.hist.length>20)db.hist.pop();save();paint()}
function newSeries(){const keep=S().draft;db.series[db.active]=emptySeries();db.series[db.active].draft=keep||{te:"",tp:"",qty:""};save();paint();fillDraft()}
function haltDay(){Object.keys(db.series).forEach(k=>closePhase(db.series[k]));db.halted=true;save();paint()}
function resumeDay(){const s=S();db.halted=false;if(s.qty&&!s.ended){s.phase=s.phase&&s.phase!=="stop"?s.phase:"prod";s.phaseStarted=Date.now()}save();paint()}
function projection(){const s=S();if(!s.qty)return"";const left=Math.max(0,s.qty-s.done);const pace=s.done>=1?(liveMs("prod")/s.done):s.teMs;const need=left*pace;const eta=Date.now()+need;const dep=parseClock(db.dep);const p1=(+db.p1||0)*60000,p2=(+db.p2||0)*60000;let msg="Fin de série estimée <b>"+hm(eta)+"</b>";if(dep){const over=eta-dep;if(over>5*60000)msg+="<br><span class='late'>Dépassement départ : "+Math.round(over/60000)+" min</span>";else msg+="<br><span class='ok'>Dans l'horaire</span>";const usedOff=liveMs("pause")+liveMs("admin")+liveMs("support")+liveMs("spirale");const slack=dep-Date.now()-need-Math.max(0,p1+p2-usedOff);if(slack>0)msg+="<br>Jeu restant ~ "+Math.round(slack/60000)+" min"}
return msg}
function paint(){document.body.className="theme-"+db.active.toLowerCase();document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.p===db.active));$("pieceLab").textContent="Série Pièce "+db.active;const s=S();const running=s.qty&&!s.ended&&!s.recap;$("setupCard").style.display=running||s.recap?"none":"block";$("runCard").style.display=running?"block":"none";$("recapCard").style.display=s.recap?"block":"none";$("btnHalt").style.display=running&&!db.halted?"":"none";$("btnResume").style.display=running&&db.halted?"":"none";tick();if(s.recap){const r=s.recap;const real=r.real?hNum(r.real)+" h/p":"n/c";const vs=r.real&&r.te?((r.real-r.te)/r.te*100):null;$("recap").innerHTML=r.done+" / "+r.qty+" pièces<br>Route "+fmt(r.setup)+" (cible "+hNum(r.tp)+" h)<br>Prod "+fmt(r.prod)+" · réel "+real+(vs==null?"":" · "+(vs>=0?"+":"")+Math.round(vs)+" %")+"<br>Pause "+fmt(r.pause)+" · admin "+fmt(r.admin)+" · support "+fmt(r.support)+" · spirale "+fmt(r.spirale)}
$("hist").innerHTML=db.hist.length?"Récent :<br>"+db.hist.slice(0,8).map(h=>h.piece+" · "+h.done+"/"+h.qty+" · prod "+fmt(h.prod)).join("<br>"):"Pas encore de série terminée."}
function tick(){$("clock").textContent=new Date().toLocaleString("fr-FR");const s=S();if(!(s.qty&&!s.ended&&!s.recap))return;const add=(s.phase&&s.phase!=="stop"&&!db.halted&&s.phaseStarted)?Date.now()-s.phaseStarted:0;$("nowTime").textContent=db.halted?"STOP":fmt(add);$("nowPhase").textContent=db.halted?"Arrêt journée":(LABELS[s.phase]||"—");$("nowMeta").textContent=s.done+" / "+s.qty+" · TE "+hNum(s.teMs)+" h · TP "+hNum(s.tpMs)+" h";$("kDone").textContent=s.done;$("kLeft").textContent=Math.max(0,s.qty-s.done);const pace=s.done>=1?liveMs("prod")/s.done:s.teMs;$("kEta").textContent=hm(Date.now()+Math.max(0,s.qty-s.done)*pace);$("proj").innerHTML=projection()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchPiece(b.dataset.p));
["arrIn","depIn","p1In","p2In"].forEach(id=>$(id).addEventListener("input",()=>{db.arr=$("arrIn").value;db.dep=$("depIn").value;db.p1=+$("p1In").value||0;db.p2=+$("p2In").value||0;save()}));
["teIn","tpIn","qtyIn"].forEach(id=>$(id).addEventListener("input",()=>{S().draft={te:$("teIn").value,tp:$("tpIn").value,qty:$("qtyIn").value};save()}));
$("btnStart").onclick=startSeries;$("btnPiece").onclick=addPiece;$("btnEnd").onclick=endSeries;$("btnNew").onclick=newSeries;$("btnHalt").onclick=haltDay;$("btnResume").onclick=resumeDay;
document.querySelectorAll("[data-ph]").forEach(b=>b.onclick=()=>startPhase(b.dataset.ph));
fillDraft();paint();setInterval(tick,1000);
</script></body></html>
