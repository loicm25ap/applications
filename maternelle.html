<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0e0f10"/>
<title>Présences Maternelle</title>
<style>
:root{--bg:#0e0f10;--panel:#17191b;--panel-2:#1e2124;--line:#2a2e32;--text:#e8e6e1;--muted:#9a958c;--gold:#c4a574;--gold-dim:#8a7349;--go:#2f6b4a;--go-bg:#1a2e22;--inj:#8a4545;--inj-bg:#2c1b1b;--girl:#e7a8bc;--boy:#8eb6d9;--warn:#b8893a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}html,body{margin:0;touch-action:manipulation}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{padding:12px 14px 8px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.date-big{font-size:22px;font-weight:600;margin:6px 0 2px;text-transform:capitalize}.date-sub{color:var(--muted);font-size:12px}
nav{display:flex;gap:5px;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1;min-height:42px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;font-size:12px}nav button.on{border-color:var(--gold-dim);color:var(--gold)}
main{max-width:560px;margin:0 auto;padding:12px 12px 40px}.screen{display:none}.screen.on{display:block}
.summary{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rate{font-size:30px;font-weight:600;color:var(--gold)}.rate.pending{color:var(--muted)}
.lab{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.meta{color:var(--muted);font-size:13px;margin-top:4px}
.badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-top:8px}.badge.ok{color:#cfe8d6;border-color:var(--go)}
.pick{display:flex;gap:8px;margin-bottom:12px}.pick input{flex:1;min-height:48px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px;font-size:16px}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.nm{font-weight:600;font-size:16px}.nm.girl{color:var(--girl)}.nm.boy{color:var(--boy)}.nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.halves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.half{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);font-size:12px}
.half.P{background:var(--go-bg);border-color:var(--go);color:#cfe8d6}.half.A{background:var(--inj-bg);border-color:var(--inj);color:#e8c4c4}
.actions{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}button,input{font:inherit;color:var(--text)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 14px;min-height:48px;font-size:15px}
.btn.gold{border-color:var(--gold-dim);color:var(--gold)}.btn.go{border-color:var(--go);color:#cfe8d6;flex:1}.btn.warn{border-color:var(--warn);color:#e6d3a8;flex:1}.btn.full{width:100%}
.locked .half{pointer-events:none}
.form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.form input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;margin-bottom:8px}
.sex{display:flex;gap:8px;margin-bottom:8px}.sex button{flex:1}.sex button.on.girl{border-color:var(--girl);color:var(--girl)}.sex button.on.boy{border-color:var(--boy);color:var(--boy)}
.child-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.hint{color:var(--muted);font-size:12px;line-height:1.45}
.bar-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}.bar-row .d{width:42px;color:var(--muted)}
.track{flex:1;height:10px;background:#222;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--gold)}.fill.low{background:var(--inj)}
h2{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.linkish{color:var(--gold);border:none;background:none;min-height:auto;padding:0;font-size:13px}
</style></head><body>
<header><h1>Présences Maternelle</h1><div class="date-big" id="dateBig">—</div><div class="date-sub" id="dateSub"></div></header>
<nav><button class="on" data-s="jour">Jour</button><button data-s="mois">Mois</button><button data-s="analyse">Analyse</button><button data-s="classe">Classe</button></nav>
<main>
<section class="screen on" id="screen-jour">
<div class="pick"><input type="date" id="dayPick"/><button class="btn gold" id="btnToday">Aujourd'hui</button></div>
<div class="summary"><div class="rates"><div><div class="lab">Matin</div><div class="rate pending" id="rateM">—</div><div class="meta" id="metaM"></div></div><div><div class="lab">Après-midi</div><div class="rate pending" id="rateS">—</div><div class="meta" id="metaS"></div></div></div><div class="badge" id="lockBadge"></div></div>
<div id="schoolBlock"><div id="list"></div>
<div class="actions"><button class="btn go" id="btnValid">Valider jour d'école</button><button class="btn warn" id="btnCorrect">Corriger</button></div>
<button class="btn full" id="btnOff">Pas d'école ce jour</button></div></section>
<section class="screen" id="screen-mois">
<div class="pick"><input type="month" id="monthPick"/><button class="btn gold" id="btnThisMonth">Mois en cours</button></div>
<div class="summary"><div class="rates"><div><div class="lab">Matin</div><div class="rate pending" id="monthRateM">—</div></div><div><div class="lab">Après-midi</div><div class="rate pending" id="monthRateS">—</div></div></div><div class="meta" id="monthMeta"></div></div>
<h2>Jours d'école</h2><div id="monthSchool"></div><h2>Jours non travaillés</h2><div id="monthOff"></div><h2>À saisir</h2><div id="monthTodo"></div>
</section>
<section class="screen" id="screen-analyse">
<div class="pick"><input type="month" id="anMonthPick"/><button class="btn gold" id="btnAnMonth">Mois en cours</button></div>
<button class="btn full" id="btnAnYear" style="margin-bottom:16px">Année</button>
<div class="summary"><div class="rates"><div><div class="lab">Matin</div><div class="rate pending" id="anRateM">—</div></div><div><div class="lab">Après-midi</div><div class="rate pending" id="anRateS">—</div></div></div><div class="meta" id="anHead"></div></div>
<h2>Matin</h2><div id="chartM"></div><h2>Après-midi</h2><div id="chartS"></div><h2>Par enfant</h2><div id="byChild"></div>
<div class="actions"><button class="btn gold full" id="btnXls">Exporter Excel (CSV)</button></div>
</section>
<section class="screen" id="screen-classe">
<div class="form"><input id="first" placeholder="Prénom" autocomplete="off"/><input id="last" placeholder="Nom" autocomplete="off"/>
<div class="sex"><button class="btn on girl" id="sexF">Fille</button><button class="btn boy" id="sexM">Garçon</button></div>
<button class="btn gold full" id="btnAdd">Ajouter l'enfant</button></div>
<div id="roster"></div>
<h2 style="margin-top:36px">Année scolaire</h2><p class="hint" id="yearHint"></p>
<button class="btn warn" id="btnNewYear" style="min-height:42px;font-size:13px;padding:8px 14px">Nouvelle année scolaire</button>
<p class="hint">1er septembre → 31 août. Exporter le CSV, par ce bouton pour archiver et repartir à vide.</p>
<div id="archives"></div>
</section></main>
<script>
const KEY="mat_v1",ARCH="mat_archives";const $=id=>document.getElementById(id);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function ymd(d){const x=d instanceof Date?d:new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function parseDay(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function isWeekend(k){const n=parseDay(k).getDay();return n===0||n===6}
function longDate(k){return parseDay(k).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function monthLabel(ym){const [y,m]=ym.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}
function schoolYearOf(ym){const [y,m]=(ym||ymd(new Date())).split("-").map(Number);const startY=m>=9?y:y-1;return{start:startY+"-09-01",end:(startY+1)+"-08-31",label:startY+"-"+(startY+1)}}
function loadArchives(){try{return JSON.parse(localStorage.getItem(ARCH))||[]}catch{return[]}}
function saveArchives(a){localStorage.setItem(ARCH,JSON.stringify(a))}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{students:[],days:{}}}catch{return{students:[],days:{}}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
let db=load(),sex="F",screen="jour",sel=ymd(new Date()),monthSel=sel.slice(0,7),anMonth=monthSel,anMode="month";
function activeStudents(){return db.students.filter(s=>s.active!==false)}
function dayRec(key){if(!db.days[key])db.days[key]={marks:{},validated:false,closed:false};return db.days[key]}
function isSchool(rec){return rec&&rec.validated&&!rec.closed}
function markOf(rec,id){const m=rec.marks[id];return m&&typeof m==="object"?m:{M:"",S:""}}
function computeHalf(rec,roster,half){const list=roster||activeStudents();let p=0,a=0,n=0,missing=0;list.forEach(s=>{n++;const m=markOf(rec,s.id)[half];if(m==="P")p++;else if(m==="A")a++;else missing++});return{p,a,n,missing,rate:n<=0||missing?null:(p/n)*100}}
function rateTxt(r){return r.rate==null?"n/c":Math.round(r.rate)+" %"}
function rosterForDay(key){const rec=db.days[key];if(rec&&rec.snapshot&&rec.snapshot.length)return rec.snapshot.map(id=>db.students.find(s=>s.id===id)).filter(Boolean);return activeStudents()}
function daysInMonth(ym){const [y,m]=ym.split("-").map(Number);const last=new Date(y,m,0).getDate(),out=[];for(let d=1;d<=last;d++)out.push(y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0"));return out}
function renderNav(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.s===screen));document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id==="screen-"+screen))}
function setSel(k){sel=k;$("dayPick").value=k;render()}function goDay(k){sel=k;screen="jour";render()}
function showRates(idR,idM,r){$(idR).textContent=r.missing||!r.n?"\u2014":rateTxt(r);$(idR).classList.toggle("pending",r.rate==null);if(idM)$(idM).textContent=r.n?(r.p+" présent"+(r.p>1?"s":"")+" / "+r.n):""}
function renderJour(){
$("dayPick").value=sel;$("dateBig").textContent=longDate(sel);
$("dateSub").textContent=sel===ymd(new Date())?"Jour affiché : aujourd'hui":"Saisie d'un autre jour";
const rec=dayRec(sel),kids=activeStudents(),week=isWeekend(sel),ui=$("schoolBlock");
if(week){$("rateM").textContent="\u2014";$("rateS").textContent="\u2014";$("rateM").classList.add("pending");$("rateS").classList.add("pending");$("metaM").textContent="";$("metaS").textContent="";$("lockBadge").textContent="Week-end — non travaillé";$("lockBadge").className="badge";ui.style.display="none";return}
if(rec.closed){$("rateM").textContent="\u2014";$("rateS").textContent="\u2014";$("rateM").classList.add("pending");$("rateS").classList.add("pending");$("metaM").textContent="";$("metaS").textContent="";$("lockBadge").textContent="Pas d'école";$("lockBadge").className="badge";ui.style.display="block";$("list").innerHTML="";$("btnValid").style.display="none";$("btnCorrect").textContent="Annuler \u00ab pas d'école \u00bb";$("btnOff").style.display="none";return}
$("btnValid").style.display="";$("btnCorrect").textContent="Corriger";$("btnOff").style.display="";ui.style.display="block";
const rm=computeHalf(rec,kids,"M"),rs=computeHalf(rec,kids,"S");showRates("rateM","metaM",rm);showRates("rateS","metaS",rs);
const miss=rm.missing+rs.missing;$("lockBadge").textContent=rec.validated?"Jour d'école validé":(miss?miss+" case"+(miss>1?"s":"")+" à noter":"Prêt à valider");$("lockBadge").className="badge"+(rec.validated?" ok":"");
const list=$("list");list.className=rec.validated?"locked":"";list.innerHTML="";
kids.sort((a,b)=>(a.last+a.first).localeCompare(b.last+b.first,"fr")).forEach(s=>{const mk=markOf(rec,s.id);const card=document.createElement("div");card.className="card";const name=document.createElement("div");name.className="nm "+(s.gender==="F"?"girl":"boy");name.innerHTML=s.first+" <small>"+s.last+"</small>";const row=document.createElement("div");row.className="halves";[["M","Matin"],["S","Après-midi"]].forEach(([h,lab])=>{const wrap=document.createElement("div");const t=document.createElement("div");t.style.cssText="font-size:11px;color:#9a958c;margin-bottom:4px";t.textContent=lab;const pair=document.createElement("div");pair.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:4px";const bp=document.createElement("button");bp.className="half"+(mk[h]==="P"?" P":"");bp.textContent="Présent";bp.onclick=()=>setMark(s.id,h,"P");const ba=document.createElement("button");ba.className="half"+(mk[h]==="A"?" A":"");ba.textContent="Absent";ba.onclick=()=>setMark(s.id,h,"A");pair.append(bp,ba);wrap.append(t,pair);row.appendChild(wrap)});card.append(name,row);list.appendChild(card)});
}
function setMark(id,half,val){const rec=dayRec(sel);if(rec.validated||rec.closed)return;if(!rec.marks[id]||typeof rec.marks[id]!=="object")rec.marks[id]={M:"",S:""};rec.marks[id][half]=rec.marks[id][half]===val?"":val;save();renderJour()}
function renderMois(){
$("monthPick").value=monthSel;const keys=daysInMonth(monthSel);let school=0,pM=0,nM=0,pS=0,nS=0,offW=0,offC=0;const schoolRows=[],todo=[],today=ymd(new Date());
keys.forEach(k=>{const rec=db.days[k];if(isWeekend(k)){offW++;return}if(rec&&rec.closed){offC++;return}if(isSchool(rec)){const rm=computeHalf(rec,rosterForDay(k),"M"),rs=computeHalf(rec,rosterForDay(k),"S");school++;if(rm.rate!=null){pM+=rm.p;nM+=rm.n}if(rs.rate!=null){pS+=rs.p;nS+=rs.n}schoolRows.push({k,rm,rs});return}if(k<=today)todo.push(k)});
const rM=nM?Math.round(pM/nM*100)+" %":"\u2014",rS=nS?Math.round(pS/nS*100)+" %":"\u2014";
$("monthRateM").textContent=rM;$("monthRateS").textContent=rS;$("monthRateM").classList.toggle("pending",!nM);$("monthRateS").classList.toggle("pending",!nS);
$("monthMeta").textContent=monthLabel(monthSel)+" \u00b7 "+school+" jour"+(school>1?"s":"")+" d'école \u00b7 présents / effectif";
$("monthSchool").innerHTML=schoolRows.length?schoolRows.map(x=>"<div class='child-card'><div>"+x.k+"</div><div>"+rateTxt(x.rm)+" / "+rateTxt(x.rs)+"</div></div>").join(""):"<p class='hint'>Aucun jour d'école validé ce mois.</p>";
$("monthOff").innerHTML="<p class='hint'>"+offW+" week-end"+(offW>1?"s":"")+(offC?" \u00b7 "+offC+" fermeture"+(offC>1?"s":""):"")+".</p>";
$("monthTodo").innerHTML=todo.length?todo.map(k=>"<div class='child-card'><div>"+k+"</div><button class='linkish' data-k='"+k+"'>Saisir</button></div>").join(""):"<p class='hint'>Rien à saisir.</p>";
$("monthTodo").querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>goDay(b.dataset.k));
$("monthSchool").querySelectorAll(".child-card").forEach((el,i)=>{el.onclick=()=>goDay(schoolRows[i].k)});
}
function renderClasse(){
const box=$("roster");box.innerHTML="";if(!db.students.length)box.innerHTML="<p class='hint'>Pas encore d'élève.</p>";
db.students.forEach(s=>{const card=document.createElement("div");card.className="child-card";const left=document.createElement("div");left.innerHTML="<div class='nm "+(s.gender==="F"?"girl":"boy")+"'>"+s.first+" "+s.last+"</div><div class='hint'>"+(s.gender==="F"?"Fille":"Gar\u00e7on")+(s.active===false?" \u00b7 retir\u00e9":"")+"</div>";const tog=document.createElement("button");tog.className="btn";tog.style.minHeight="42px";tog.style.fontSize="13px";tog.textContent=s.active===false?"Réintégrer":"Retirer";tog.onclick=()=>{s.active=s.active===false;save();render()};const right=document.createElement("div");right.appendChild(tog);card.append(left,right);box.appendChild(card)});
const y=schoolYearOf(sel);$("yearHint").textContent="Année en cours : "+y.label+" (1er sept. "+y.start.slice(0,4)+" → 31 août "+y.end.slice(0,4)+".";
const arch=loadArchives();$("archives").innerHTML=arch.length?"<h2>Archives</h2>"+arch.map(a=>"<div class='child-card'><div>"+a.label+" \u00b7 "+(a.students||[]).length+" enfants</div></div>").join(""):"";
}
function inAnalyse(k){if(anMode==="year"){const y=schoolYearOf(anMonth);return k>=y.start&&k<=y.end}return k.slice(0,7)===anMonth}
function barBox(id,rows){const el=$(id);el.innerHTML=rows.length?"":"<p class='hint'>Aucun jour validé.</p>";rows.forEach(r=>el.appendChild(r))}
function renderAnalyse(){
$("anMonthPick").value=anMonth;$("btnAnYear").classList.toggle("gold",anMode==="year");
const keys=Object.keys(db.days).sort().filter(inAnalyse);let pM=0,nM=0,pS=0,nS=0,nb=0;const rowsM=[],rowsS=[];
keys.forEach(k=>{const rec=db.days[k];if(!isSchool(rec))return;const rm=computeHalf(rec,rosterForDay(k),"M"),rs=computeHalf(rec,rosterForDay(k),"S");if(rm.rate==null&&rs.rate==null)return;nb++;if(rm.rate!=null){pM+=rm.p;nM+=rm.n}if(rs.rate!=null){pS+=rs.p;nS+=rs.n};const lab=k.slice(8)+"/"+k.slice(5,7);
const mk=document.createElement("div");mk.className="bar-row";mk.innerHTML="<span class='d'>"+lab+"</span><div class='track'><div class='fill"+(rm.rate!=null&&rm.rate<80?" low":"")+"' style='width:"+(rm.rate||0)+"%'></div></div><span>"+(rm.rate==null?"\u2014":Math.round(rm.rate)+"%")+"</span>";
const sk=document.createElement("div");sk.className="bar-row";sk.innerHTML="<span class='d'>"+lab+"</span><div class='track'><div class='fill"+(rs.rate!=null&&rs.rate<80?" low":"")+"' style='width:"+(rs.rate||0)+"%'></div></div><span>"+(rs.rate==null?"\u2014":Math.round(rs.rate)+"%")+"</span>";rowsM.push(mk);rowsS.push(sk)});
$("anRateM").textContent=nM?Math.round(pM/nM*100)+" %":"\u2014";$("anRateS").textContent=nS?Math.round(pS/nS*100)+" %":"\u2014";$("anRateM").classList.toggle("pending",!nM);$("anRateS").classList.toggle("pending",!nS);
const periode=anMode==="year"?("année scolaire "+schoolYearOf(anMonth).label):monthLabel(anMonth);
$("anHead").textContent=periode+" \u00b7 "+nb+" jour"+(nb>1?"s":"")+" d'école \u00b7 présents / effectif";barBox("chartM",rowsM);barBox("chartS",rowsS);
const by={};keys.forEach(k=>{const rec=db.days[k];if(!isSchool(rec))return;rosterForDay(k).forEach(s=>{if(!by[s.id])by[s.id]={s,PM:0,AM:0,PS:0,AS:0};const m=markOf(rec,s.id);if(m.M==="P")by[s.id].PM++;if(m.M==="A")by[s.id].AM++;if(m.S==="P")by[s.id].PS++;if(m.S==="A")by[s.id].AS++})});
const box=$("byChild");box.innerHTML="";const rows=Object.values(by).sort((a,b)=>(a.s.last+a.s.first).localeCompare(b.s.last+b.s.first,"fr"));
if(!rows.length)box.innerHTML="<p class='hint'>Pas encore de stats.</p>";
rows.forEach(x=>{const denM=x.PM+x.AM,denS=x.PS+x.AS;const rM=denM?Math.round(x.PM/denM*100)+"%":"n/c",rS=denS?Math.round(x.PS/denS*100)+"%":"n/c";const div=document.createElement("div");div.className="child-card";div.innerHTML="<div><div class='nm "+(x.s.gender==="F"?"girl":"boy")+"'>"+x.s.first+" "+x.s.last+"</div><div class='hint'>Matin P "+x.PM+" / A "+x.AM+" \u00b7 Après-midi P "+x.PS+" / A "+x.AS+"</div></div><div>"+rM+" / "+rS+"</div>";box.appendChild(div)});
}
function render(){renderNav();renderJour();renderMois();renderAnalyse();renderClasse()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{screen=b.dataset.s;render()});
$("dayPick").onchange=()=>{if($("dayPick").value)setSel($("dayPick").value)};
$("btnToday").onclick=()=>setSel(ymd(new Date()));
$("monthPick").onchange=()=>{if($("monthPick").value){monthSel=$("monthPick").value;renderMois()}};
$("btnThisMonth").onclick=()=>{monthSel=ymd(new Date()).slice(0,7);renderMois()};
$("anMonthPick").onchange=()=>{if($("anMonthPick").value){anMonth=$("anMonthPick").value;anMode="month";renderAnalyse()}};
$("btnAnMonth").onclick=()=>{anMonth=ymd(new Date()).slice(0,7);anMode="month";renderAnalyse()};
$("btnAnYear").onclick=()=>{anMode="year";renderAnalyse()};
$("sexF").onclick=()=>{sex="F";$("sexF").classList.add("on");$("sexM").classList.remove("on")};
$("sexM").onclick=()=>{sex="M";$("sexM").classList.add("on");$("sexF").classList.remove("on")};
$("btnAdd").onclick=()=>{const first=$("first").value.trim(),last=$("last").value.trim();if(!first||!last){alert("Prénom et nom requis.");return}db.students.push({id:uid(),first,last,gender:sex,active:true});$("first").value="";$("last").value="";save();render()};
$("btnValid").onclick=()=>{if(isWeekend(sel))return;const kids=activeStudents();if(!kids.length){alert("Ajoutez d'abord les enfants.");return}const rec=dayRec(sel);if(rec.closed)return;const rm=computeHalf(rec,kids,"M"),rs=computeHalf(rec,kids,"S");if(rm.missing||rs.missing){alert("Notez matin et après-midi pour chaque enfant.");return}rec.validated=true;rec.closed=false;rec.snapshot=kids.map(s=>s.id);save();render()};
$("btnCorrect").onclick=()=>{const rec=dayRec(sel);if(rec.closed){if(!confirm("Remettre ce jour comme jour d'école à saisir ?"))return;rec.closed=false;save();render();return}if(!rec.validated)return;if(!confirm("Rouvrir la journée ?"))return;rec.validated=false;save();render()};
$("btnOff").onclick=()=>{if(isWeekend(sel))return;if(!confirm("Marquer "+longDate(sel)+" comme jour sans école ?"))return;const rec=dayRec(sel);rec.closed=true;rec.validated=false;save();render()};
$("btnNewYear").onclick=()=>{const y=schoolYearOf(ymd(new Date()));if(!confirm("Archiver "+y.label+" et vider l'appli pour une nouvelle classe ?\nExportez d'abord le CSV si besoin."))return;const arch=loadArchives();arch.push({label:y.label,saved:ymd(new Date()),students:db.students,days:db.days});saveArchives(arch);db={students:[],days:{}};save();alert("Année "+y.label+" archivée.");screen="classe";render()};
$("btnXls").onclick=()=>{const lines=["\uFEFF","Journal","date;demi;prenom;nom;sexe;etat"];Object.keys(db.days).sort().forEach(k=>{const rec=db.days[k];if(!isSchool(rec))return;rosterForDay(k).forEach(s=>{const m=markOf(rec,s.id);[["M","matin"],["S","apres_midi"]].forEach(([h,lab])=>{const etat=m[h]==="P"?"present":m[h]==="A"?"absent":"";if(etat)lines.push([k,lab,s.first,s.last,s.gender==="F"?"F":"G",etat].join(";"))})})});lines.push("","Taux","date;presents_matin;absents_matin;effectif_matin;taux_matin;presents_am;absents_am;effectif_am;taux_am");Object.keys(db.days).sort().forEach(k=>{const rec=db.days[k];if(!isSchool(rec))return;const rm=computeHalf(rec,rosterForDay(k),"M"),rs=computeHalf(rec,rosterForDay(k),"S");lines.push([k,rm.p,rm.a,rm.n,rm.rate==null?"":Math.round(rm.rate*10)/10,rs.p,rs.a,rs.n,rs.rate==null?"":Math.round(rs.rate*10)/10].join(";"))});const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8"}));a.download="presences-maternelle-"+sel+".csv";a.click()};
render();
</script></body></html>
