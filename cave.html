<title>Cave</title>
<style>
:root{--bg:#120e0e;--panel:#1b1616;--panel2:#241c1c;--line:#3a2e2e;--text:#efe6de;--muted:#a89890;--wine:#8a4a4a;--gold:#c4a574}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.sub{color:var(--muted);font-size:12px;margin-top:4px}
nav{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1;min-height:40px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;font-size:12px}
nav button.on{border-color:var(--wine);color:#e8c4c4}
main{max-width:560px;margin:0 auto;padding:12px}
.screen{display:none}.screen.on{display:block}
.card,.form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.lab{color:var(--muted);font-size:11px;text-transform:uppercase}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;margin:5px 0 10px;color:var(--text)}
textarea{min-height:64px}
.hint{color:var(--muted);font-size:12px;line-height:1.4}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:12px;min-height:44px;font:inherit}
.btn.full{width:100%}.btn.wine{border-color:#6a3a3a;background:#2a1c1c;color:#e8c4c4}
.btn.go{border-color:#5a7a66;background:#1c2420;color:#c5d9cc}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:6px 10px;font-size:12px;color:var(--text)}
.chip.on{border-color:var(--wine);color:#e8c4c4}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);margin-right:4px}
.tag.rouge{color:#e8c4c4;border-color:#6a3a3a}.tag.blanc{color:#e8e0c8;border-color:#6a6248}
.tag.rose{color:#e8c8d0;border-color:#6a4a54}.tag.bulles{color:#c8d4e0;border-color:#4a5a6a}
.kpi{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.kpi div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.kpi b{display:block;font-size:18px;color:var(--gold)}
.title{font-weight:650;margin:2px 0 4px}
.meta{color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
</style></head><body>
<header><h1>Cave</h1><div class="sub" id="clock"></div></header>
<nav>
<button class="on" data-s="cave">Cave</button>
<button data-s="ajout">Ajouter</button>
<button data-s="soir">Ce soir</button>
<button data-s="conseil">Conseil</button>
</nav>
<main>
<section class="screen on" id="screen-cave">
<div class="kpi"><div><b id="kCave">0</b><span class="lab">En cave</span></div><div><b id="kNow">0</b><span class="lab">À boire</span></div><div><b id="kKeep">0</b><span class="lab">À garder</span></div></div>
<div class="chips" id="filtres"></div>
<input id="q" placeholder="Chercher cépage, domaine, appellation"/>
<div id="liste"></div>
<div class="actions"><button class="btn" id="btnBak">Sauvegarder JSON</button><button class="btn" id="btnImp">Importer</button></div>
<input type="file" id="bakFile" accept="application/json,.json" style="display:none"/>
</section>
<section class="screen" id="screen-ajout">
<div class="form">
<div class="lab">Couleur</div><div class="chips" id="colChips"></div>
<div class="lab">Domaine / producteur</div><input id="fDom"/>
<div class="lab">Cuvée</div><input id="fCuvee"/>
<div class="lab">Appellation / région</div><input id="fApp"/>
<div class="lab">Cépage</div><div class="chips" id="cepChips"></div>
<input id="fCep" placeholder="Laisse vide si tu ne sais pas"/>
<p class="hint">Prix et fenêtre : optionnels. Bouton Compléter pour Grok.</p>
<div class="row"><div><div class="lab">Millésime</div><input id="fMill" inputmode="numeric"/></div><div><div class="lab">Prix €</div><input id="fPrix" inputmode="decimal"/></div></div>
<div class="lab">Où dans la cave</div><input id="fLieu"/>
<div class="lab">Quand la boire</div>
<select id="fWin"><option value="now">Maintenant</option><option value="soon">2 à 5 ans</option><option value="keep">Garder</option><option value="unk">Je ne sais pas</option></select>
<div class="lab">Note perso</div><textarea id="fNote"></textarea>
<button class="btn wine full" id="btnSave">Enregistrer</button>
<button class="btn full" id="btnCancel" style="margin-top:8px;display:none">Annuler</button>
</div></section>
<section class="screen" id="screen-soir"><p class="hint">Filtre selon le plat.</p><div class="chips" id="platChips"></div><div id="soirList"></div></section>
<section class="screen" id="screen-conseil"><p class="hint">Copie le texte et colle-le dans Grok.</p><textarea id="occ" placeholder="Occasion"></textarea>
<button class="btn wine full" id="btnCopy">Copier le conseil à coller</button>
<pre class="card hint" id="preview" style="white-space:pre-wrap"></pre></section>
</main>
<script>
const KEY="cave_v1";const $=id=>document.getElementById(id);
const COLS=[{id:"rouge",n:"Rouge"},{id:"blanc",n:"Blanc"},{id:"rose",n:"Rosé"},{id:"bulles",n:"Bulles"},{id:"autre",n:"Autre"}];
const CEPS=["Je ne sais pas","Pinot noir","Gamay","Syrah","Grenache","Merlot","Cabernet sauvignon","Cabernet franc","Malbec","Mourvèdre","Carignan","Cinsault","Nebbiolo","Sangiovese","Tempranillo","Chardonnay","Sauvignon blanc","Chenin","Riesling","Viognier","Gewurztraminer","Ugni blanc","Clairette","Muscat","Pinot gris","Assemblage"];
const PLATS=[{id:"all",n:"Tout"},{id:"apero",n:"Apéro"},{id:"viande",n:"Viande"},{id:"poisson",n:"Poisson"},{id:"fromage",n:"Fromage"},{id:"dessert",n:"Dessert"}];
const WIN={now:"Maintenant",soon:"2–5 ans",keep:"Garder",unk:"?"};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{bottles:[]}}catch{return{bottles:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
let db=load(),editId=null,col="rouge",filtre="all",plat="all";
if(!Array.isArray(db.bottles))db.bottles=[];
function inCave(b){return !b.status||b.status==="cave"}
function go(s){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.s===s));document.querySelectorAll(".screen").forEach(el=>el.classList.toggle("on",el.id==="screen-"+s));render()}
function chips(box,items,cur,fn){box.innerHTML="";items.forEach(it=>{const id=it.id||it,n=it.n||it;const b=document.createElement("button");b.className="chip"+(cur===id?" on":"");b.textContent=n;b.onclick=()=>fn(id);box.appendChild(b)})}
function resetForm(){editId=null;col="rouge";["fDom","fCuvee","fApp","fCep","fMill","fPrix","fLieu","fNote"].forEach(i=>$(i).value="");$("fWin").value="unk";$("btnCancel").style.display="none";$("btnSave").textContent="Enregistrer"}
function fillForm(b){editId=b.id;col=b.color||"rouge";$("fDom").value=b.dom||"";$("fCuvee").value=b.cuvee||"";$("fApp").value=b.app||"";$("fCep").value=b.cep||"";$("fMill").value=b.mill||"";$("fPrix").value=b.prix||"";$("fLieu").value=b.lieu||"";$("fWin").value=b.win||"unk";$("fNote").value=b.note||"";$("btnCancel").style.display="";$("btnSave").textContent="Mettre à jour"}
function copyAsk(b){const t="Complète cette fiche cave.\nDomaine : "+(b.dom||"?")+"\nCuvée : "+(b.cuvee||"?")+"\nAppellation : "+(b.app||"?")+"\nCouleur : "+(b.color||"?")+"\nMillésime : "+(b.mill||"?")+"\nCépage : "+(b.cep||"?")+"\nPrix : "+(b.prix||"?")+"\nFenêtre : "+(WIN[b.win]||"?")+"\n\nPropose cépage, fenêtre now/soon/keep, fourchette €, une phrase.";(async()=>{try{await navigator.clipboard.writeText(t);alert("Copié.")}catch{prompt("Copie",t)}})()}
function line(b){return [b.mill,b.dom,b.cuvee,b.app,b.cep].filter(Boolean).join(" · ")}
function matchPlat(b,p){if(p==="all")return true;const c=(b.cep||"").toLowerCase(),co=b.color;if(p==="apero")return co==="bulles"||co==="blanc"||co==="rose";if(p==="viande")return co==="rouge";if(p==="poisson")return co==="blanc"||co==="bulles";if(p==="fromage")return true;if(p==="dessert")return /muscat|gewurz|moelleux/.test((b.cuvee+" "+c).toLowerCase());return true}
function renderListe(target,arr){target.innerHTML="";if(!arr.length){target.innerHTML="<p class='hint'>Rien ici.</p>";return}arr.forEach(b=>{const d=document.createElement("div");d.className="card";d.innerHTML="<span class='tag "+(b.color||"")+"'>"+(COLS.find(c=>c.id===b.color)||{n:"?"}).n+"</span><span class='tag'>"+(WIN[b.win]||"?")+"</span>"+(b.cep?"<span class='tag'>"+b.cep+"</span>":"")+"<div class='title'>"+(b.dom||"Sans domaine")+(b.cuvee?" — "+b.cuvee:"")+"</div><div class='meta'>"+[b.mill,b.app,b.lieu,b.prix?b.prix+" €":""].filter(Boolean).join(" · ")+"</div>";const act=document.createElement("div");act.className="actions";const e=document.createElement("button");e.className="btn";e.textContent="Modifier";e.onclick=()=>{fillForm(b);go("ajout")};const g=document.createElement("button");g.className="btn wine";g.textContent="Compléter";g.onclick=()=>copyAsk(b);const o=document.createElement("button");o.className="btn go";o.textContent="Bue";o.onclick=()=>{if(!confirm("Marquer bue ?"))return;b.status="bue";save();render()};act.append(e,g,o);d.appendChild(act);target.appendChild(d)})}
function render(){$("clock").textContent=new Date().toLocaleString("fr-FR");const cave=db.bottles.filter(inCave);$("kCave").textContent=cave.length;$("kNow").textContent=cave.filter(b=>b.win==="now").length;$("kKeep").textContent=cave.filter(b=>b.win==="keep").length;chips($("filtres"),[{id:"all",n:"Toutes"},...COLS,{id:"now",n:"À boire"}],filtre,id=>{filtre=id;render()});chips($("colChips"),COLS,col,id=>{col=id;render()});chips($("cepChips"),CEPS,null,id=>{$("fCep").value=id});const q=($("q").value||"").toLowerCase();let list=cave.slice();if(filtre!=="all"&&filtre!=="now")list=list.filter(b=>b.color===filtre);if(filtre==="now")list=list.filter(b=>b.win==="now");if(q)list=list.filter(b=>line(b).toLowerCase().includes(q));list.sort((a,b)=>(a.color||"").localeCompare(b.color||"")||String(a.dom||"").localeCompare(String(b.dom||""),"fr"));renderListe($("liste"),list);chips($("platChips"),PLATS,plat,id=>{plat=id;render()});renderListe($("soirList"),cave.filter(b=>matchPlat(b,plat)).sort((a,b)=>(a.win==="now"?0:1)-(b.win==="now"?0:1)).slice(0,8));$("preview").textContent="Conseil cave\nOccasion : "+(($("occ").value||"").trim()||"?")+"\n\n"+cave.map(b=>"- "+line(b)+" | "+(WIN[b.win]||"")).join("\n")+"\n\nPropose 2 ou 3 bouteilles."}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{if(b.dataset.s==="ajout"&&!editId)resetForm();go(b.dataset.s)});
$("q").oninput=render;$("occ").oninput=render;
$("btnSave").onclick=()=>{const rec={id:editId||("b"+Date.now()),color:col,dom:$("fDom").value.trim(),cuvee:$("fCuvee").value.trim(),app:$("fApp").value.trim(),cep:$("fCep").value.trim()||"à préciser",mill:$("fMill").value.trim(),prix:$("fPrix").value.trim(),lieu:$("fLieu").value.trim(),win:$("fWin").value,note:$("fNote").value.trim(),status:"cave"};if(!rec.dom&&!rec.cuvee){alert("Domaine ou cuvée.");return}const i=db.bottles.findIndex(x=>x.id===rec.id);if(i>=0)db.bottles[i]={...db.bottles[i],...rec};else db.bottles.push(rec);save();resetForm();go("cave")};
$("btnCancel").onclick=()=>{resetForm();go("cave")};
$("btnCopy").onclick=async()=>{const t=$("preview").textContent;try{await navigator.clipboard.writeText(t);alert("Copié")}catch{prompt("Copie",t)}};
$("btnBak").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="cave.json";a.click()};
$("btnImp").onclick=()=>$("bakFile").click();
$("bakFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(Array.isArray(x.bottles)){db=x;save();render()}}catch{}};r.readAsText(f)};
render();
</script></body></html>
